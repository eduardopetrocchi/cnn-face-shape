services:

  # Treino completo: prepare -> train -> evaluate
  train:
    build: .
    command: python main.py
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
      - ./.env:/app/.env

  # Só API (modelo já treinado)
  api:
    build: .
    command: python -m app.app
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./.env:/app/.env


# MLFlow UI
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    restart: unless-stopped