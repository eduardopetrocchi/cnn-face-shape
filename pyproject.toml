[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CNN-face-shape"
version = "0.1.0"
description = "Sistema de classificação do formato do rosto"
readme= "REDME.md"
requires-python = ">=3.10"
authors = [
    {name = "Eduardo Souza", email = "eduardopetrocchi@hotmail.com"}
]
dependencies = [
    "tensorflow[and-cuda]",
    "pyyaml==6.0.2",
    "pillow==12.1.1",
    "mlflow==2.22.1",
    "python-dotenv==1.1.0",
    "dvc==3.66.1",
    "dagshub==0.5.9",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
